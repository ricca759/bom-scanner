<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nokia 3210 Snake</title>
  <style>
    :root {
      --screen-bg: #9bbc0f;
      --screen-pixel: #0f380f;
      --shell: #adb5bd;
      --shell-dark: #6c757d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #d9d9d9, #9ca3af 75%);
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #212529;
      padding: 16px;
    }

    .phone {
      width: min(92vw, 420px);
      background: linear-gradient(165deg, #ced4da, var(--shell));
      border-radius: 28px;
      border: 3px solid var(--shell-dark);
      box-shadow: inset 0 2px 8px #ffffff80, 0 16px 40px #00000040;
      padding: 22px 16px 26px;
    }

    .speaker {
      width: 120px;
      height: 10px;
      border-radius: 999px;
      background: repeating-linear-gradient(
        90deg,
        #495057,
        #495057 4px,
        #6c757d 4px,
        #6c757d 8px
      );
      margin: 0 auto 18px;
      opacity: 0.75;
    }

    .screen-wrap {
      border-radius: 12px;
      padding: 12px;
      background: #6c757d;
      border: 2px solid #495057;
      margin-bottom: 20px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--screen-pixel);
    }

    canvas {
      width: 100%;
      display: block;
      image-rendering: pixelated;
      border: 2px solid #0f380f90;
      border-radius: 4px;
      background: var(--screen-bg);
      box-shadow: inset 0 0 0 2px #30623060;
    }

    .controls {
      display: grid;
      gap: 10px;
      justify-content: center;
      user-select: none;
    }

    .row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      width: 58px;
      height: 46px;
      border-radius: 999px;
      border: 2px solid #495057;
      background: linear-gradient(180deg, #e9ecef, #adb5bd);
      color: #212529;
      font-weight: bold;
      font-size: 1rem;
      box-shadow: 0 2px 4px #00000030;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 1px 2px #00000030;
    }

    .hint {
      text-align: center;
      margin-top: 14px;
      font-size: 0.85rem;
      color: #343a40;
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Nokia style snake game">
    <div class="speaker" aria-hidden="true"></div>

    <section class="screen-wrap">
      <div class="hud">
        <span id="score">Score: 0</span>
        <span id="best">Best: 0</span>
      </div>
      <canvas id="game" width="240" height="240" aria-label="Snake game board"></canvas>
    </section>

    <section class="controls" aria-label="Touch controls">
      <div class="row"><button data-dir="up" aria-label="Move up">▲</button></div>
      <div class="row">
        <button data-dir="left" aria-label="Move left">◀</button>
        <button id="start" aria-label="Start or restart game">●</button>
        <button data-dir="right" aria-label="Move right">▶</button>
      </div>
      <div class="row"><button data-dir="down" aria-label="Move down">▼</button></div>
    </section>

    <p class="hint">Arrow keys / swipe buttons to move. Press ● to start.</p>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const startBtn = document.getElementById('start');

    const gridSize = 15;
    const tileCount = canvas.width / gridSize;
    const pixel = '#0f380f';

    let snake;
    let food;
    let direction;
    let nextDirection;
    let gameLoop;
    let score = 0;
    let best = Number(localStorage.getItem('snakeBest')) || 0;
    let running = false;

    bestEl.textContent = `Best: ${best}`;

    function resetGame() {
      snake = [
        { x: 8, y: 8 },
        { x: 7, y: 8 },
        { x: 6, y: 8 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { ...direction };
      score = 0;
      scoreEl.textContent = 'Score: 0';
      placeFood();
      draw();
      drawText('PRESS ●');
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } while (snake.some(part => part.x === food.x && part.y === food.y));
    }

    function setDirection(newDir) {
      if (!running) return;
      const opposite = direction.x + newDir.x === 0 && direction.y + newDir.y === 0;
      if (!opposite) nextDirection = newDir;
    }

    function startGame() {
      if (gameLoop) clearInterval(gameLoop);
      running = true;
      direction = { x: 1, y: 0 };
      nextDirection = { ...direction };
      gameLoop = setInterval(tick, 115);
    }

    function endGame() {
      running = false;
      clearInterval(gameLoop);
      gameLoop = null;
      if (score > best) {
        best = score;
        localStorage.setItem('snakeBest', String(best));
        bestEl.textContent = `Best: ${best}`;
      }
      drawText('GAME OVER\n● TO RETRY');
    }

    function tick() {
      direction = nextDirection;
      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      const hitWall = head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
      const hitSelf = snake.some(part => part.x === head.x && part.y === head.y);

      if (hitWall || hitSelf) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = `Score: ${score}`;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#9bbc0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#30623045';
      for (let i = 0; i <= tileCount; i++) {
        const p = i * gridSize;
        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, p);
        ctx.lineTo(canvas.width, p);
        ctx.stroke();
      }

      ctx.fillStyle = pixel;
      snake.forEach((part, index) => {
        const inset = index === 0 ? 1 : 2;
        ctx.fillRect(
          part.x * gridSize + inset,
          part.y * gridSize + inset,
          gridSize - inset * 2,
          gridSize - inset * 2
        );
      });

      ctx.fillRect(food.x * gridSize + 4, food.y * gridSize + 4, gridSize - 8, gridSize - 8);
    }

    function drawText(text) {
      ctx.fillStyle = '#9bbc0fcc';
      ctx.fillRect(24, 92, canvas.width - 48, 56);
      ctx.strokeStyle = pixel;
      ctx.strokeRect(24, 92, canvas.width - 48, 56);
      ctx.fillStyle = pixel;
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      const lines = text.split('\n');
      lines.forEach((line, i) => {
        ctx.fillText(line, canvas.width / 2, 114 + i * 18);
      });
    }

    document.addEventListener('keydown', (e) => {
      const keyMap = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 }
      };

      if (e.key in keyMap) {
        e.preventDefault();
        setDirection(keyMap[e.key]);
      } else if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        resetGame();
        startGame();
      }
    });

    document.querySelectorAll('[data-dir]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const map = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 }
        };
        setDirection(map[btn.dataset.dir]);
      });
    });

    startBtn.addEventListener('click', () => {
      resetGame();
      startGame();
    });

    resetGame();
  </script>
</body>
</html>
